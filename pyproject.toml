[project]
name = "mapf-bench-primal2"
version = "0.1.0"
description = "PRIMAL2 adapter for mapf_bench"
requires-python = ">=3.10"
dependencies = [
  "mapf-bench",
]

[tool.setuptools]
packages = ["mapf_bench_primal2"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"